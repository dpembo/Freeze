name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual runs

permissions:
  contents: write # Needed to create releases and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # build.gradle.kts computes the plugin version from this ("<base>.<beta><BUILD_NUMBER>"),
      # falling back to the literal string "Unofficial" if it's unset — which is how Jenkins
      # (their normal CI) provides it. GitHub's per-workflow run number is the closest
      # equivalent: unique and always incrementing, so every release gets a real version
      # instead of every build being tagged "Unofficial".
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed so we can look at previous tags/releases

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract computed version from Gradle
        id: version
        run: |
          # Read the actual evaluated project.version rather than reimplementing
          # build.gradle.kts's version-computation logic in bash.
          VERSION=$(./gradlew -q properties | grep "^version:" | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Get latest release version
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the most recent release tag (if any exist)
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "No previous releases found"
            echo "latest_version=" >> $GITHUB_OUTPUT
            echo "is_new_version=true" >> $GITHUB_OUTPUT
          else
            # Strip leading 'v' if present
            LATEST_VERSION=${LATEST_TAG#v}
            echo "Latest release version: $LATEST_VERSION"
            echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

            CURRENT="${{ steps.version.outputs.version }}"
            if [ "$CURRENT" = "$LATEST_VERSION" ]; then
              echo "Version has NOT changed → will create snapshot"
              echo "is_new_version=false" >> $GITHUB_OUTPUT
            else
              echo "Version HAS changed → will create clean release"
              echo "is_new_version=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Determine JAR name and tag
        id: naming
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IS_NEW="${{ steps.latest.outputs.is_new_version }}"

          # Since BUILD_NUMBER (github.run_number) is baked into the version
          # itself and always increments, every run naturally produces a new
          # version string — so this will almost always take the "clean
          # release" branch below rather than ever falling back to a snapshot.
          if [ "$IS_NEW" = "true" ]; then
            JAR_NAME="Freeze-${VERSION}.jar"
            TAG="v${VERSION}"
            RELEASE_NAME="Freeze ${VERSION}"
            PRERELEASE=false

            if [[ "$VERSION" == *"-pre"* ]] || [[ "$VERSION" == *"SNAPSHOT"* ]] || [[ "$VERSION" == *"Beta"* ]] || [[ "$VERSION" == *"RC"* ]]; then
              PRERELEASE=true
            fi
          else
            TIMESTAMP=$(date -u +%Y%m%d%H%M)
            JAR_NAME="Freeze-${VERSION}-snapshot-${TIMESTAMP}.jar"
            TAG="v${VERSION}-snapshot-${TIMESTAMP}"
            RELEASE_NAME="Freeze ${VERSION} Snapshot (${TIMESTAMP})"
            PRERELEASE=true
          fi

          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

          echo "JAR name     : $JAR_NAME"
          echo "Tag          : $TAG"
          echo "Release name : $RELEASE_NAME"
          echo "Prerelease   : $PRERELEASE"

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Locate and rename the built JAR
        id: artifact
        run: |
          # withSourcesJar()/withJavadocJar() are enabled, so build/libs/ also
          # contains Freeze-sources.jar and Freeze-javadoc.jar - exclude those.
          BUILT_JAR=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)

          if [ -z "$BUILT_JAR" ]; then
            echo "ERROR: No JAR found in build/libs/"
            ls -la build/libs/
            exit 1
          fi

          echo "Found built JAR: $BUILT_JAR"
          FINAL_NAME="${{ steps.naming.outputs.jar_name }}"
          cp "$BUILT_JAR" "$FINAL_NAME"
          echo "final_jar=$FINAL_NAME" >> $GITHUB_OUTPUT
          ls -lh "$FINAL_NAME"

      - name: Create GitHub Release and upload JAR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.naming.outputs.tag }}"
          NAME="${{ steps.naming.outputs.release_name }}"
          JAR="${{ steps.artifact.outputs.final_jar }}"
          PRERELEASE="${{ steps.naming.outputs.prerelease }}"
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ github.sha }}"

          NOTES=$(cat <<EOF
          Automated build of **Freeze** (dpembo fork of SirBlobman/Freeze)

          - **Version:** \`${VERSION}\`
          - **Artifact:** \`${JAR}\`
          - **Commit:** ${SHA}
          - **Date:** $(date -u +"%Y-%m-%d %H:%M UTC")
          EOF
          )

          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" \
              --title "$NAME" \
              --notes "$NOTES" \
              --prerelease \
              "$JAR"
          else
            gh release create "$TAG" \
              --title "$NAME" \
              --notes "$NOTES" \
              "$JAR"
          fi

          echo "Release created successfully: $TAG"